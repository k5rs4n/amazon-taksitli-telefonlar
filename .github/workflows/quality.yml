name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check assets/history-analysis.js
          node --check assets/price-alerts.js
          node --check assets/advanced-features.js

      - name: Run frontend tests
        run: |
          node tests/ui.test.js
          node tests/advanced.test.js
          node tests/history-analysis.test.js
          node tests/price-alerts.test.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser updater dependencies
        run: python -m pip install -r requirements-browser.txt

      - name: Check Python syntax and updater tests
        run: |
          python -m py_compile scripts/update_price_history.py scripts/update_price_history_browser.py
          python -m unittest discover -s tests -p 'test_update_price_history*.py'
